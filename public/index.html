<!-- หาตำแหน่งใน index.html ตรงส่วน Timeline และเพิ่มส่วนนี้เข้าไป -->
<div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12">
    <!-- ส่วนเดิม -->
    <div class="date-badge p-6 rounded-2xl text-center">
        <p class="text-blue-400 text-xs uppercase orbitron mb-2">งวดที่ออกวันนี้</p>
        <p id="inputDate" class="text-lg font-semibold text-white">--</p>
        <p id="inputResultDisplay" class="text-sm text-slate-400 mt-1">ผลรางวัล: --</p>
    </div>
    <div class="date-badge p-6 rounded-2xl text-center border-green-500/30 bg-green-500/10">
        <p class="text-green-400 text-xs uppercase orbitron mb-2">งวดที่คำนวณวันถัดไป</p>
        <p id="predDate" class="text-lg font-semibold text-white">--</p>
        <p class="text-sm text-slate-400 mt-1">เป้าหมายการทำนาย</p>
    </div>
    <!-- ส่วนที่เพิ่มใหม่: แสดงจำนวนข้อมูลจริง -->
    <div class="date-badge p-6 rounded-2xl text-center border-yellow-500/30 bg-yellow-500/10">
        <p class="text-yellow-400 text-xs uppercase orbitron mb-2">ฐานข้อมูลสถิติจริง</p>
        <p id="datasetSize" class="text-lg font-semibold text-white">--</p>
        <p class="text-sm text-slate-400 mt-1">งวดที่ถูกวิเคราะห์</p>
    </div>
</div>

<!-- ในส่วน <script> แก้ไขฟังก์ชัน sync() -->
<script>
    async function sync() {
        const res = await fetch('/api/prediction');
        const data = await res.json();
        document.getElementById('inputDate').innerText = data.inputDate;
        document.getElementById('inputResultDisplay').innerText = `ผลรางวัล: ${data.inputResult}`;
        document.getElementById('predDate').innerText = data.predictionDate;
        document.getElementById('datasetSize').innerText = `${data.datasetSize} งวด`; // เพิ่มบรรทัดนี้
        document.getElementById('mainNum').innerText = data.number;
        document.getElementById('mainProb').innerText = `ความน่าจะเป็น: ${data.probability}`;
        document.getElementById('method').innerText = data.methodology;
        document.getElementById('mainReason').innerText = data.analysis;
        document.getElementById('lastUpdate').innerText = data.lastUpdate;
    }
    // ... ส่วนที่เหลือเหมือนเดิม ...
</script>
